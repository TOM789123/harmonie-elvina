# Déploiement automatique vers O2switch à chaque push sur main (FTPS via lftp).
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   FTP_SERVEUR, FTP_UTILISATEUR, FTP_MOT_DE_PASSE
name: Déploiement O2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploiement-o2switch

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer sur O2switch (FTPS)
        env:
          FTP_SERVEUR: ${{ secrets.FTP_SERVEUR }}
          FTP_UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.FTP_MOT_DE_PASSE }}
        # Pas de suppression côté serveur (.well-known, cgi-bin… restent intacts).
        run: |
          # Nettoie les secrets (espaces, retour à la ligne, préfixe ftp://, slash final)
          SERVEUR="$(printf '%s' "$FTP_SERVEUR" | tr -d '[:space:]')"
          SERVEUR="${SERVEUR#ftp://}"; SERVEUR="${SERVEUR#ftps://}"; SERVEUR="${SERVEUR%/}"
          UTILISATEUR="$(printf '%s' "$FTP_UTILISATEUR" | tr -d '[:space:]')"
          LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export LFTP_PASSWORD
          getent hosts "$SERVEUR" > /dev/null && echo "Serveur FTP : nom résolu" || { echo "Serveur FTP introuvable (vérifier le secret FTP_SERVEUR)"; exit 1; }
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u '$UTILISATEUR' --env-password '$SERVEUR';
            mirror --reverse --verbose --parallel=3 \
              -X .git/ -X .github/ -X .gitignore -X outils/ -X LISEZMOI.md \
              ./ ./
          "
